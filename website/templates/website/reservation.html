{% extends "website/base.html" %}
{% load static %}

{% block title %}Restaurant Reservation | Tibetan Mom's Kitchen{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block body %}

<section class="reservation-section">

    <h2>Restaurant Reservation</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- NAME -->
        <label>Your Name</label>
        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>
        </div>

        <!-- PHONE -->
        <label>Phone Number</label>
        <div class="input-box">
            <i class="fa-solid fa-phone"></i>
            <input type="text"
                   name="phone"
                   placeholder="Enter phone number"
                   required>
        </div>

        <!-- DATE -->
        <label>Reservation Date</label>
        <div class="input-box">
            <i class="fa-solid fa-calendar-days"></i>
            <input type="date"
                   name="date"
                   required>
        </div>

        <!-- TIME -->
        <label>Reservation Time</label>
        <div class="input-box">
            <i class="fa-solid fa-clock"></i>
            <input type="time"
                   name="time"
                   required>
        </div>

        <!-- GUESTS -->
        <label>Number of Guests</label>
        <div class="input-box">
            <i class="fa-solid fa-users"></i>
            <input type="number"
                   name="guests"
                   placeholder="How many guests?"
                   required>
        </div>

        <!-- BUTTON -->
        <button type="submit">Book Table</button>

    </form>

</section>

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =========================
   SECTION
========================= */
.reservation-section{
    width:100%;
    padding:60px 20px;
    background:#f9fafb;
    min-height:100vh;
}

/* =========================
   TITLE
========================= */
h2{
    text-align:center;
    font-size:34px;
    color:#b45309;
    margin-bottom:35px;
    font-weight:700;
}

/* =========================
   FORM
========================= */
form{
    width:430px;
    max-width:95%;
    margin:auto;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* =========================
   LABELS
========================= */
label{
    display:block;
    margin-bottom:8px;
    color:#444;
    font-size:15px;
    font-weight:600;
}

/* =========================
   INPUT BOX
========================= */
.input-box{
    position:relative;
    margin-bottom:22px;
}

/* ICONS */
.input-box i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#d97706;
    font-size:16px;
}

/* INPUT */
.input-box input{
    width:100%;
    padding:13px 14px 13px 45px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:0.3s;
    background:#fff;
}

/* DATE + TIME MOBILE FIX */
input[type="date"],
input[type="time"]{
    appearance:none;
    -webkit-appearance:none;
    min-height:50px;
}

/* FOCUS */
.input-box input:focus{
    border-color:#f59e0b;
    box-shadow:0 0 8px rgba(245,158,11,0.3);
}

/* =========================
   BUTTON
========================= */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
}

/* HOVER */
button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(217,119,6,0.35);
}

/* =========================
   MOBILE
========================= */
@media(max-width:500px){

    form{
        padding:22px;
    }

    h2{
        font-size:26px;
    }

}

</style>

{% endblock %}
