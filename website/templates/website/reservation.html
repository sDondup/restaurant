{% extends "website/base.html" %}
{% load static i18n %}

{% block title %}{% trans "Restaurant Reservation" %} | Tibetan Mom's Kitchen{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/reservation.css' %}">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block body %}

<section class="reservation-section">

    <h2>{% trans "Restaurant Reservation" %}</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- NAME -->
        <label>{% trans "Your Name" %}</label>
        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="name"
                   placeholder="{% trans 'Enter your name' %}"
                   required>
        </div>

        <!-- PHONE -->
        <label>{% trans "Phone Number" %}</label>
        <div class="input-box">
            <i class="fa-solid fa-phone"></i>
            <input type="text" name="phone"
                   placeholder="{% trans 'Enter phone number' %}"
                   required>
        </div>

        <!-- DATE -->
        <label>{% trans "Reservation Date" %}</label>
        <div class="input-box">
            <i class="fa-solid fa-calendar-days"></i>
            <input type="date" name="date" required>
        </div>

        <!-- TIME -->
        <label>{% trans "Reservation Time" %}</label>
        <div class="input-box">
            <i class="fa-solid fa-clock"></i>
            <input type="time" name="time" required>
        </div>

        <!-- GUESTS -->
        <label>{% trans "Number of Guests" %}</label>
        <div class="input-box">
            <i class="fa-solid fa-users"></i>
            <input type="number" name="guests"
                   placeholder="{% trans 'How many guests?' %}"
                   required>
        </div>

        <!-- BUTTON -->
        <button type="submit">
            {% trans "Book Table" %}
        </button>

    </form>

</section>

{% endblock %}
