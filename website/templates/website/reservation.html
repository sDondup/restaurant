{% extends "website/base.html" %}
{% load static %}

{% block title %}Contact Us | Tibetan Mom's Kitchen{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}

{% block body %}

<h2>Restaurant Reservation</h2>

<form method="POST">
  {% csrf_token %}

  <input type="text" name="name" placeholder="Your Name" required><br><br>

  <input type="text" name="phone" placeholder="Phone Number" required><br><br>

  <input type="date" name="date" required><br><br>

  <input type="time" name="time" required><br><br>

  <input type="number" name="guests" placeholder="Guests" required><br><br>

  <button type="submit">Book Table</button>
</form>

<style>
        /* =========================
    GLOBAL RESET
    ========================= */
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    }

    /* =========================
    PAGE TITLE
    ========================= */
    h2 {
    text-align: center;
    margin-top: 40px;
    font-size: 32px;
    color: #b45309;
    font-weight: 700;
    letter-spacing: 1px;
    }

    /* =========================
    FORM CONTAINER
    ========================= */
    form {
    width: 420px;
    max-width: 90%;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: 1px solid #f3f4f6;
    }

    /* =========================
    INPUT FIELDS
    ========================= */
    form input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.3s;
    outline: none;
    }

    /* Focus effect */
    form input:focus {
    border-color: #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
    }

    /* =========================
    BUTTON
    ========================= */
    form button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
    letter-spacing: 0.5px;
    }

    /* Hover effect */
    form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(217, 119, 6, 0.4);
    }

    /* =========================
    MOBILE RESPONSIVE
    ========================= */
    @media (max-width: 500px) {
    form {
        padding: 20px;
    }

    h2 {
        font-size: 24px;
    }
    }
</style>
{% endblock %}
