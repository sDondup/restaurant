{% extends 'website/base.html' %}
{% load static %}

{% block title %}Menu{% endblock %}

{% block body %}

<div class="menu-page">

    <h2 class="page-title">Our Menu</h1>

    <div class="language-switcher">

        <a href="?lang=EN"
           class="{% if selected_lang == 'EN' %}active{% endif %}">
            Menu in English 
        </a>

        <a href="?lang=NL"
           class="{% if selected_lang == 'NL' %}active{% endif %}">
            Menu in NL
        </a>

    </div>

    <div class="menu-grid">

        {% for item in menus %}

        <div class="menu-card">

            <img
                src="{{ item.image.url }}"
                alt="{{ item.title }}"
                onclick="openModal({{ forloop.counter0 }})">

            <div class="menu-content">
                <h3>{{ item.title }}</h3>
            </div>

        </div>

        {% empty %}

        <div class="no-menu">
            <h3>No menu uploaded for this language.</h3>
        </div>

        {% endfor %}

    </div>

</div>

<div class="image-modal" id="imageModal">

    <span class="close-modal" onclick="closeModal()">&times;</span>

    <button class="nav-btn prev-btn" onclick="prevImage()">❮</button>

    <img id="modalImage">

    <button class="nav-btn next-btn" onclick="nextImage()">❯</button>

</div>

<script id="menu-images-data" type="application/json">
    [
    {% for item in menus %}
        "{{ item.image.url }}"{% if not forloop.last %},{% endif %}
    {% endfor %}
    ]
    </script>

<script>
    const images = JSON.parse(
        document.getElementById("menu-images-data").textContent
    );

    let currentIndex = 0;

    function openModal(index) {

        currentIndex = index;

        document.getElementById("imageModal").style.display = "flex";
        document.getElementById("modalImage").src = images[currentIndex];
    }

    function closeModal() {

        document.getElementById("imageModal").style.display = "none";
    }

    function nextImage() {

        currentIndex = (currentIndex + 1) % images.length;

        document.getElementById("modalImage").src = images[currentIndex];
    }

    function prevImage() {

        currentIndex = (currentIndex - 1 + images.length) % images.length;

        document.getElementById("modalImage").src = images[currentIndex];
    }

    window.addEventListener("click", function(event) {

        const modal = document.getElementById("imageModal");

        if (event.target === modal) {
            closeModal();
        }

    });

    document.addEventListener("keydown", function(e) {

        const modal = document.getElementById("imageModal");

        if (modal.style.display === "flex") {

            if (e.key === "ArrowRight") nextImage();
            if (e.key === "ArrowLeft") prevImage();
            if (e.key === "Escape") closeModal();

        }

    });

    let startX = 0;
    let endX = 0;

    const modal = document.getElementById("imageModal");

    modal.addEventListener("touchstart", function(e) {
        startX = e.touches[0].clientX;
    }, { passive: true });

    modal.addEventListener("touchend", function(e) {

        endX = e.changedTouches[0].clientX;

        const diff = startX - endX;

        if (diff > 50) {
            nextImage();
        }

        if (diff < -50) {
            prevImage();
        }

    }, { passive: true });
</script>
<link rel="stylesheet" href="{% static 'css/menu.css' %}">
{% endblock %}
