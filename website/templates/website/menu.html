{% extends 'website/base.html' %}
{% load static %}

{% block title %}Menu{% endblock %}

{% block body %}

<style>

/* =========================
   MENU PAGE
========================= */
.menu-page {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 30px 20px;
}

/* =========================
   TITLE
========================= */
.page-title {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 50px;
    color: #404042;
}

/* =========================
   GRID
========================= */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 35px;
}

/* =========================
   CARD
========================= */
.menu-card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    transition: 0.3s ease;
}

.menu-card:hover {
    transform: translateY(-8px);
}

/* =========================
   IMAGE
========================= */
.menu-card img {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    background: #f5f5f5;
    padding: 10px;
    display: block;
    cursor: pointer;
}

/* =========================
   CONTENT
========================= */
.menu-content {
    padding: 20px;
    text-align: center;
}

.menu-content h3 {
    font-size: 24px;
    color: #222;
    margin: 0;
}

/* =========================
   IMAGE MODAL
========================= */
.image-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.96);
    justify-content: center;
    align-items: center;
}

/* MODAL IMAGE */
.image-modal img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
    touch-action: pinch-zoom;
}

/* CLOSE BUTTON */
.close-modal {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 42px;
    cursor: pointer;
    z-index: 10000;
}

/* DESKTOP NAV BUTTONS */
.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    font-size: 40px;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
}

.nav-btn:hover {
    background: rgba(255,255,255,0.3);
}

.prev-btn {
    left: 20px;
}

.next-btn {
    right: 20px;
}

/* =========================
   TABLET
========================= */
@media (max-width: 992px) {

    .menu-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu-card img {
        max-height: 400px;
    }

}

/* =========================
   MOBILE
========================= */
@media (max-width: 768px) {

    .menu-page {
        padding: 15px 10px;
    }

    .page-title {
        font-size: 30px;
        margin-bottom: 25px;
    }

    .menu-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .menu-card img {
        max-height: 300px;
        padding: 8px;
    }

    .menu-content {
        padding: 14px;
    }

    .menu-content h3 {
        font-size: 18px;
    }

    .close-modal {
        font-size: 32px;
        right: 15px;
    }

    /* HIDE BUTTONS ON MOBILE */
    .nav-btn {
        display: none;
    }

}

</style>

<div class="menu-page">

    <h1 class="page-title">Our Menu</h1>

    <div class="menu-grid">

        {% for item in menus %}

        <div class="menu-card">

            <img src="{{ item.image.url }}"
                 alt="{{ item.title }}"
                 onclick="openModal({{ forloop.counter0 }})">

            <div class="menu-content">
                <h3>{{ item.title }}</h3>
            </div>

        </div>

        {% endfor %}

    </div>

</div>

<!-- =========================
     IMAGE POPUP
========================= -->
<div class="image-modal" id="imageModal">

    <span class="close-modal" onclick="closeModal()">&times;</span>

    <!-- Desktop Buttons -->
    <button class="nav-btn prev-btn" onclick="prevImage()">❮</button>

    <img id="modalImage">

    <button class="nav-btn next-btn" onclick="nextImage()">❯</button>

</div>

<script>

/* =========================
   IMAGE LIST
========================= */

const images = [
    {% for item in menus %}
        "{{ item.image.url }}",
    {% endfor %}
];

let currentIndex = 0;

/* =========================
   OPEN MODAL
========================= */

function openModal(index) {

    currentIndex = index;

    document.getElementById("imageModal").style.display = "flex";

    document.getElementById("modalImage").src = images[currentIndex];
}

/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

    document.getElementById("imageModal").style.display = "none";

}

/* =========================
   NEXT IMAGE
========================= */

function nextImage() {

    currentIndex = (currentIndex + 1) % images.length;

    document.getElementById("modalImage").src = images[currentIndex];

}

/* =========================
   PREVIOUS IMAGE
========================= */

function prevImage() {

    currentIndex = (currentIndex - 1 + images.length) % images.length;

    document.getElementById("modalImage").src = images[currentIndex];

}

/* =========================
   CLICK OUTSIDE CLOSE
========================= */

window.addEventListener("click", function(event) {

    const modal = document.getElementById("imageModal");

    if (event.target == modal) {
        closeModal();
    }

});

/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener("keydown", function(e) {

    const modal = document.getElementById("imageModal");

    if (modal.style.display === "flex") {

        if (e.key === "ArrowRight") {
            nextImage();
        }

        if (e.key === "ArrowLeft") {
            prevImage();
        }

        if (e.key === "Escape") {
            closeModal();
        }
    }

});

/* =========================
   UNIVERSAL TOUCH SWIPE
========================= */

let startX = 0;
let endX = 0;

const modal = document.getElementById("imageModal");

/* TOUCH START */
modal.addEventListener("touchstart", function(e) {

    startX = e.touches[0].clientX;

}, { passive: true });

/* TOUCH END */
modal.addEventListener("touchend", function(e) {

    endX = e.changedTouches[0].clientX;

    handleSwipe();

}, { passive: true });

/* SWIPE DETECTION */
function handleSwipe() {

    const diff = startX - endX;

    /* LEFT SWIPE */
    if (diff > 50) {
        nextImage();
    }

    /* RIGHT SWIPE */
    if (diff < -50) {
        prevImage();
    }

}

</script>

{% endblock %}
